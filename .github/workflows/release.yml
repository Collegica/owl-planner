name: release

# On a published release, build the browser app and attach it as
# owl-web.tar.gz. The Collegica site's deploy fetches the latest one into
# public/owl/, so publishing a release here is what updates the page there.
on:
  release:
    types: [published]

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.72.2
          cache: true
      - name: Build and check parity with the CLI
        run: pixi run web-parity
      - name: Pack
        run: tar -C web/dist -czf owl-web.tar.gz .
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" owl-web.tar.gz --clobber
