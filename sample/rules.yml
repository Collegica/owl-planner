# --- Levelled obligations -------------------------------------------------
# A payment made on the last day of the month sometimes clears on the 1st or
# 2nd of the next one. Bucketing by the date on the statement then invents a
# double month and an empty one, and the year's spread reads as chaos that
# isn't there. An obligation listed here is charged at its monthly rate --
# what was actually paid, divided by the months observed -- instead of on the
# date it happened to clear. Only list payments that really are monthly: this
# is a fix for a calendar artefact, not a way to smooth real variation.
level:
  - match: 'withdrawal.*interac'
    note: support payment — made on the last day of the month from chequing

# --- Pass-throughs --------------------------------------------------------
# Money that arrived and left again for the same reason. Neither side is
# income or spending; counting either one distorts both. Pinned by date and
# amount because no pattern can tell a pass-through from a real payment.
passthrough:
  - date: 2026-03-15
    amount: 250
    note: cashback reward received — a rebate, not income
  - date: 2026-03-15
    amount: 250
    note: the same reward passed straight on

# --- Dated one-offs -------------------------------------------------------
# A transaction only you can classify, pinned to date and amount so nothing
# else is swept up. Kept out of the recurring baseline by the size test.
dated:
  - date: 2026-02-10
    amount: 1500
    line: Gifts
    note: a wedding

# --- Decided one-offs -----------------------------------------------------
# An irregular item you have looked at and judged genuinely one-time. It stays
# out of the recurring baseline either way; recording it here just stops the
# tool asking again, and leaves the reason on the record.
one_off:
  - date: 2026-05-20
    amount: 3800
    note: transmission — a repair, not a service interval
  - date: 2026-02-10
    amount: 1500
    note: the wedding gift — once

# --- Fallback: the bank's own category, when no rule above matched ---------
# Several banks append a category to each description. It is coarse — "Retail
# and Grocery" is both a supermarket and a hardware store — so it is used only
# after the specific rules, and lines it fills are marked in the budget.
bank_categories:
  'Retail and Grocery': Groceries
  'Restaurants': Restaurants
  'Transportation': Other transportation
  'Professional and Financial Services': Banking fees
  'Personal and Household Expenses': Other personal
  'Health and Education': Other health care
  'Home and Office Improvement': "Furniture, accessories, tools"
  'Entertainment and Recreation': Other recreation
  'Currency Transactions': Other personal
