# The invented household's rules. Every name, date and amount here is made up.
# description pattern (case-insensitive regex)  ->  budget line
#
# Order matters: the first match wins. Add your own at the top of a group as
# you triage uncategorised.csv — that file is the whole feedback loop.

# --- Excluded: money moving between your own accounts ----------------------
# Counting these as spending is the single most common budgeting error. If you
# export both a chequing account and a credit card, the card PAYMENT is not
# spending — the individual card purchases already are. Counting both doubles
# every dollar you put on the card.
transfers:
  - 'payment.*(thank you|received)'
  - '(pay|payment) to .*(visa|mastercard|amex|credit card)'
  - 'credit card.*payment'
  - 'transfer (to|from) .*(savings|chequing|checking|tfsa|rrsp)'
  - '(mb-)?transfer to\s+credit\s*card'
  # a line-of-credit advance repaid from chequing a few days later is three
  # legs and one dollar: list every leg.
  - 'cash advance to\s*-'
  - 'royal bank of canada'
  - 'payment from\s*-'
  - 'online banking (transfer|payment).*(visa|master|scotia|loc|line of credit)'
  - 'online banking loan payment'
  - 'online banking transfer'
  - '(mb-)?transfer (to|from) .*(visa|mastercard|amex)'
  - 'internet transfer'
  - 'virement'
  - 'e-?transfer.*(to|from) (self|myself)'

# --- Income: inflows that are not refunds ---------------------------------
income:
  - 'payroll|paie|salary|direct deposit.*(pay|payroll)'
  - 'tax refund'
  - 'mapleworks'               # the household's employer, named
  - 'canada (fed|pro)|cra |arc '
  - 'interest paid|interet'

